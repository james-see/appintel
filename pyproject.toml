[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appintel"
version = "1.0.3"
description = "A command line tool to search and compare prices of apps and music on the Apple Store"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
maintainers = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
requires-python = ">=3.10"
keywords = ["itunes", "data-analysis", "api", "market-research", "pricing", "apple-store"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/james-see/appintel"
Repository = "https://github.com/james-see/appintel"
Issues = "https://github.com/james-see/appintel/issues"

[project.scripts]
appintel = "appintel.appintel:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["appintel"]

[tool.coverage.run]
branch = true
source = ["appintel"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
